name: deployBackend

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: deploy
            uses: appleboy/ssh-action@v1
            with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                port: ${{ secrets.PORT }}
                timeout: 30s
                command_timeout: 5m
                script_stop: true
                script: |
                    cd /
                    pm2 delete index.js || true
                    rm -rf Kvisser
                    git clone https://github.com/tusant19/Kvisser.git
                    cd Kvisser
                    cd back-end
                    npm install
                    pm2 start index.js
          - name: verify ssh key
            if: always()
            env:
                SSH_KEY: ${{ secrets.KEY }}
            run: |
                printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
                chmod 600 "$RUNNER_TEMP/deploy_key"
                ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" | ssh-keygen -lf -
                rm -f "$RUNNER_TEMP/deploy_key"